<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>MENU WINBOOK</title>

<!-- CHUẨN MOBILE + PC -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<style>
/* NỀN GIỮ NGUYÊN, KHÔNG CẮT, FIXED */
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    min-height: 100vh;

    background: url('https://i.postimg.cc/j5sxP9Gb/MENU-BOT-TELE.png') center top no-repeat;
    background-size: contain;
    background-attachment: fixed;
    background-color: #000;

    overflow-x: hidden;
    font-family: Arial, sans-serif;

    -webkit-text-size-adjust: none !important;
    text-size-adjust: none !important;
}

/* KHUNG CHÍNH */
.wrap {
    width: 100%;
    text-align: center;
    margin-top: 240px;
    padding-bottom: 50px;
}

/* SUB-TITLE */
.sub-title {
    color: #ffffff;
    font-size: 28px;
    font-weight: 900;
    line-height: 1.25;
    margin-top: -30px;
    margin-bottom: 22px;
    text-shadow: 0 0 12px #000;
    letter-spacing: 1px;
    padding: 0 10px;
}

/* TIÊU ĐỀ */
.title {
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 10px;
    text-shadow: 0 0 6px #000;
}

/* NÚT */
.btn {
    width: 420px;
    max-width: 92%;
    padding: 14px;
    margin: 14px auto;
    border-radius: 40px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 17px;
    font-weight: bold;
    color: #333;
    position: relative;
    overflow: hidden;
}

/* LED BORDER */
.btn::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 40px;
    padding: 3px;
    background: linear-gradient(90deg, #ffdf00, #ff8a00, #ffffff, #ffdf00);
    background-size: 300% 300%;
    animation: ledRun 2.2s linear infinite;
    z-index: 2;
    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
            mask-composite: exclude;
}

@keyframes ledRun {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.icon {
    width: 28px;
    height: 28px;
    border-radius: 5px;
    object-fit: cover;
    background: #fff;
    padding: 2px;
    z-index: 5;
}

.btn span {
    z-index: 5;
    color: #333;
}
</style>
</head>
